anchor:
  - &tmin -3400
  - &tmax -3350
  - &tdiffmin  -20
  - &tdiffmax  20
  - &qmin  0
  - &qmax  32000
  - &qdiffmin -16000
  - &qdiffmax  16000
  
include:
  - name: hist/mneut/mneut.tmpl.hist.yaml
    replace:
      ID:   0
      TMIN: *tmin 
      TMAX: *tmax
      QMIN: *qmin
      QMAX: *qmax
      TDIFFMIN: *tdiffmin
      TDIFFMAX: *tdiffmax
      QDIFFMIN: *qdiffmin
      QDIFFMAX: *qdiffmax

