Anchor:
 - &input   ridf/@NAME@@NUM@.ridf
 - &output  output/@NAME@@NUM@.root
 - &histout output/hist/chk@NAME@@NUM@.root

Processor:
   - name: timer
     type: art::TTimerProcessor

   - name: ridf
     type: art::TRIDFEventStore
     parameter:
       OutputTransparency: 0
       InputFiles:
         - *input
         
   - name: mapper
     type: art::TMappingProcessor
     parameter:
      OutputTransparency: 1         
         
   - include: mneut/mneut.yaml
     
   - name: projection_mneut
     type: art::TTreeProjectionProcessor
     parameter:
       Type:     art::TTreeProjection
       FileName: hist/mneut/mneut.hist.yaml
       OutputFilename: *histout     

   - name: outputtree
     type: art::TOutputTreeProcessor
     parameter:
       FileName:
         - *output     


