Processor:
  - name: proc_mneut_ch2ns
    type: art::TParameterArrayLoader
    parameter:
      Name:     prm_mneut_ch2ns
      Type:     art::TAffineConverter
      FileName: prm/menut/ch2ns.dat

  - name: proc_mneut_prm_ch2MeV
    type: art::TParameterArrayLoader
    parameter:
      Name:     prm_mneut_ch2MeV
      Type:     art::TAffineConverter
      FileName: prm/mneut/mneut_ch2MeV.dat

  - name: proc_mneut_raw
    type: art::TTimingChargeMappingProcessor
    parameter:
      CatID:              40
      ChargeType:         2
      TimingTypeID:       0
      TrailingComesFirst: 0
      OutputCollection:   mneut_raw
      OutputTransparency: 0

  - name: proc_mneut_calib
    type: art::TTimingChargeCalibrationProcessor
    parameter:
      InputCollection:      mneut_raw
      OutputCollection:     mneut_cal
      TimingConverterArray: mneut_ch2ns
      ChargeConverterArray: mneut_ch2MeV

  - name: proc_mneut_separater
    type: art::TSeparateOutputProcessor
    parameter:
      InputCollection: mneut_cal
      OutputCollections:
        - mneut1_l
        - mneut1_r
        - mneut2_l
        - mneut2_r
        - mneut3_l
        - mneut3_r
        - mneut4_l
        - mneut4_r        

  - name: proc_mneut1
    type: art::TTwoSidedPlasticCalibrationProcessor
    parameter:
      InputCollection1: mneut1_l
      InputCollection2: mneut1_r
      OutputCollection: mneut1
